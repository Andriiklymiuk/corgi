# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    # Generate shell completions for bundling into release archive + brew.
    # Built once via `go run .` so we don't depend on the release binary's
    # platform. Banner is suppressed because main.canShowWelcomeMessages
    # excludes the `completion` subcommand.
    - mkdir -p completions
    - sh -c "go run . completion bash > completions/corgi.bash"
    - sh -c "go run . completion zsh  > completions/corgi.zsh"
    - sh -c "go run . completion fish > completions/corgi.fish"
builds:
  - id: corgi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
archives:
  - files:
      - completions/*
# Developer ID signing + notarization of the macOS binaries, from any runner
# (no Xcode: GoReleaser signs with the p12 and talks to Apple's notary API).
# Enabled only when the secrets are set, so a fork releases unsigned as
# before. Signing matters beyond Gatekeeper: macOS ties file-access grants
# (Documents, Desktop) to the signing identity, so a signed corgi stops
# asking again after every upgrade. See docs/release-signing.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - corgi
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
# Homebrew: a cask in andriiklymiuk/homebrew-tools (macOS). The tap's
# tap_migrations.json moves anyone on the old formula over on their next
# `brew upgrade`. Linux gets the install script and the deb/rpm/apk below.
homebrew_casks:
  - name: corgi
    homepage: https://github.com/Andriiklymiuk/corgi
    description: "Command line interface for database configurations and other
      useful things, written in Go"
    repository:
      owner: Andriiklymiuk
      name: homebrew-tools
    binaries:
      - corgi
    completions:
      bash: completions/corgi.bash
      zsh: completions/corgi.zsh
      fish: completions/corgi.fish
    caveats: |
      Shell tab-completion installed for bash, zsh, fish:
        corgi run --services <TAB>      # services from corgi-compose.yml
        corgi run --dbServices <TAB>    # db_services
        corgi script -n <TAB>           # script names per service
        corgi tunnel <TAB>              # tunnelable services

      zsh users — if `<TAB>` shows files instead of names, your shell
      isn't loading brew's site-functions. Add this to ~/.zshrc BEFORE
      `compinit` (one-time, fixes all brew-installed completions):

        FPATH="#{HOMEBREW_PREFIX}/share/zsh/site-functions:$FPATH"
        autoload -Uz compinit && compinit

      Then: `rm -f ~/.zcompdump* && exec zsh`

      What's new:
        https://github.com/Andriiklymiuk/corgi/releases/tag/v#{version}

# Linux packages, attached to the release: `sudo dpkg -i corgi_*.deb`,
# `sudo rpm -i corgi_*.rpm`, `apk add --allow-untrusted corgi_*.apk`.
nfpms:
  - id: corgi
    package_name: corgi
    homepage: https://github.com/Andriiklymiuk/corgi
    maintainer: Andrii Klymiuk <klim.andrew@hotmail.com>
    description: Command line interface for database configurations and other useful things
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: completions/corgi.bash
        dst: /usr/share/bash-completion/completions/corgi
      - src: completions/corgi.zsh
        dst: /usr/share/zsh/site-functions/_corgi
      - src: completions/corgi.fish
        dst: /usr/share/fish/vendor_completions.d/corgi.fish
