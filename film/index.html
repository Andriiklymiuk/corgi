<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The corgi film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=block">
<style>
:root { --ink: #1B1B4B; --paper: #F7F2EA; --orange: #F59A2E; --lilac: #E4E6F5; }
html, body { margin: 0; height: 100%; background: #0a0e2a; overflow: hidden; }
#fit { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 38%, rgba(255, 255, 255, .5), transparent 62%); mix-blend-mode: soft-light; }
svg.ink { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: visible; fill: none; stroke: var(--ink);
  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
svg.ink text { stroke: none; fill: var(--ink); font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-weight: 500; letter-spacing: -.01em; }
svg.ink text.sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 0; }
svg.ink text.mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
.term { position: absolute; background: #0d1030; border: 1px solid rgba(27, 27, 75, .5); border-radius: 12px; box-shadow: 0 1px 2px rgba(27, 27, 75, .12), 0 18px 44px -12px rgba(27, 27, 75, .32); overflow: hidden; transform-origin: 50% 50%; }
.term .bar { height: 30px; display: flex; align-items: center; padding: 0 12px; background: #161a40; color: #9aa0cf; font-size: 12px; position: relative; }
.term .bar i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; margin-right: 7px; }
.term .bar i + i { background: #febc2e; } .term .bar i + i + i { background: #28c840; }
.term .bar span { position: absolute; left: 0; right: 0; text-align: center; }
.term .body { padding: 12px 16px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; line-height: 1.6; white-space: pre; color: #FDF6F2; }
.term .l { min-height: 1.6em; } .term b { color: #fff; font-weight: 600; }
.term .hi { background: rgba(255, 161, 51, .16); box-shadow: inset 3px 0 #FFA133; margin: 0 -16px; padding: 0 16px; }
.term .cur { display: inline-block; width: .55em; height: 1.05em; background: #FDF6F2; vertical-align: -.18em; }
.cap { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-weight: 500; font-size: 35px; line-height: 1.12; letter-spacing: -.015em; color: var(--ink); padding: 0 200px; text-wrap: balance; }
.cap small { display: block; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18.5px; font-weight: 400; letter-spacing: 0; margin-top: 10px; opacity: .72; }
.cap em { font-style: italic; color: #C96A12; }
.chip { position: absolute; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; white-space: pre; background: #0d1030; color: #F7F2EA; border: 1px solid rgba(27, 27, 75, .5); border-radius: 9px; padding: 8px 14px; box-shadow: 0 10px 26px -10px rgba(27, 27, 75, .35); transform-origin: 50% 50%; }
.chip .g { color: #3fb950; } .chip .o { color: #FFA133; }
.card { position: absolute; background: #fff; border: 1px solid rgba(27, 27, 75, .22); border-radius: 10px; padding: 10px 13px; font-size: 14px; font-weight: 600; color: #1B1B4B; box-shadow: 0 1px 2px rgba(27, 27, 75, .08), 0 12px 28px -12px rgba(27, 27, 75, .28); transform-origin: 50% 50%; white-space: nowrap; }
.card small { display: block; font-weight: 400; font-size: 12px; opacity: .7; margin-top: 3px; }
.card .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #FCE3C2; color: #8A4A08; margin-left: 6px; font-weight: 600; }
.card .tag.g { background: #D6EFE1; color: #1C6E49; } .card .tag.r { background: #F6D9D4; color: #9A3324; }
#ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 14, 42, .55); cursor: pointer; z-index: 5; }
#ui button { font: 700 22px/1 -apple-system, "Segoe UI", sans-serif; color: #0a0e2a; background: #FFA133; border: 0; border-radius: 40px; padding: 18px 34px; cursor: pointer; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; z-index: 4; cursor: pointer; }
#bar div { position: absolute; left: 0; bottom: 0; height: 4px; background: #FFA133; }
.capture #ui, .capture #bar { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="boil0" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
  <filter id="boil1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
  <filter id="boil2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="27"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
</svg>
<div id="fit"><div id="stage"></div><div id="bar"><div></div></div><div id="ui"><button>▶&nbsp; Play the corgi film</button></div></div>
<audio id="music" preload="auto" src="music.mp3"></audio>
<script>
const BAR = 60 / 90 * 4;
const SCENE_BARS = [0, 3, 6, 8, 12, 15, 18, 20, 23, 28, 30, 36, 41, 43, 48, 52, 56, 58, 61, 64, 68];
const DURATION = SCENE_BARS[SCENE_BARS.length - 1] * BAR;
const INK = "#1B1B4B", PAPER = "#F7F2EA", ORANGE = "#F59A2E", NIGHT = "#0d1030", GREEN = "#2E9E6B", RED = "#C4513F", PINK = "#F2A0A8";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const out = (t) => 1 - Math.pow(1 - t, 3);
const back = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 + 1.45 * Math.pow(t - 1, 3) + .45 * Math.pow(t - 1, 2));
const pop = (t, a, d = .45) => back(seg(t, a, a + d));
const sin = Math.sin, cos = Math.cos, PI = Math.PI;
const rad = (d) => d * PI / 180;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const mix = (a, b, t) => {
	const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
	const x = h(a), y = h(b);
	return "#" + x.map((v, i) => Math.round(lerp(v, y[i], t)).toString(16).padStart(2, "0")).join("");
};

const svg = (inner) => `<svg class="ink" viewBox="0 0 1280 720">${inner}</svg>`;
const P = (d, p = 1, attrs = "") => (p <= 0 ? "" : `<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - clamp(p)).toFixed(4)}" ${attrs}/>`);
const G = (inner, tf, attrs = "") => `<g transform="${tf}" ${attrs}>${inner}</g>`;
const at = (x, y, s = 1, r = 0) => `translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`;
const T = (x, y, s, size, attrs = "") => `<text x="${x}" y="${y}" font-size="${(/class="(sans|mono)"/.test(attrs) ? size : size * .7).toFixed(1)}" ${attrs}>${esc(s)}</text>`;
const check = (x, y, p, s = 1, color = GREEN) => (p <= 0 ? "" : G(`<circle r="15" fill="${color}" stroke="none"/>` + P("M-7 0 L-2 6 L8 -6", 1, 'stroke="#fff" stroke-width="4"'), at(x, y, s * back(clamp(p)))));

function corgi(o) {
	const { x, y, s = 1, t = 0, walk = 0, flip = false, sleep = 0, carry = 0, wag = 1, tongue = 1 } = o;
	const ph = t * 15;
	const sw = (i) => walk * sin(ph + i * PI) * 10;
	const bob = walk * Math.abs(sin(ph)) * -5 + sleep * 26;
	const tail = sin(t * 20) * 22 * wag * (1 - sleep);
	const head = sleep * 26 + sin(t * 3) * 2 * (1 - sleep) + walk * sin(ph) * 3;
	const leg = (lx, i) => `<path d="M${lx} 98 L${(lx + sw(i)).toFixed(1)} 129 q1 7 10 7" />`;
	const legs = sleep > .5 ? `<path d="M70 104 q-4 8 10 8 M150 104 q6 9 22 6"/>` : leg(66, 0) + leg(84, 1) + leg(140, 1) + leg(158, 0);
	const breathe = 1 + sleep * sin(t * 2.2) * .03;
	const body = G(`<path d="M48 78 C44 52 70 50 96 52 L150 52 C176 52 180 74 176 88 C172 104 150 104 130 104 L80 104 C60 104 50 98 48 78 Z" fill="${ORANGE}"/>
		<path d="M152 62 C168 68 172 96 150 104 L128 104 C144 94 150 78 152 62Z" fill="#fff" stroke="none"/>
		<path d="M48 78 C44 52 70 50 96 52 L150 52 C176 52 180 74 176 88 C172 104 150 104 130 104 L80 104 C60 104 50 98 48 78 Z"/>`, `translate(112 104) scale(1 ${breathe.toFixed(3)}) translate(-112 -104)`);
	const eye = sleep > .5 ? `<path d="M181 38 q5 4 10 0"/>` : `<circle cx="186" cy="37" r="3.4" fill="var(--ink)" stroke="none"/>`;
	const headG = G(`<path d="M156 22 L149 -8 L174 12 Z" fill="${ORANGE}"/><path d="M178 12 L193 -10 L197 20 Z" fill="${ORANGE}"/>
		<path d="M150 32 C150 10 196 10 198 34 C210 36 221 42 221 50 C221 60 206 64 196 62 C186 72 156 70 150 52 Z" fill="${ORANGE}"/>
		<path d="M197 35 C210 36 221 42 221 50 C221 60 206 64 196 62 C190 56 190 44 197 35 Z" fill="#fff" stroke="none"/>
		<path d="M150 32 C150 10 196 10 198 34 C210 36 221 42 221 50 C221 60 206 64 196 62 C186 72 156 70 150 52 Z"/>
		<circle cx="218" cy="46" r="4.6" fill="var(--ink)" stroke="none"/>${eye}
		${tongue && !carry && sleep < .5 ? `<path d="M202 61 q1 12 8 8 q3 -4 0 -9" fill="${PINK}"/>` : `<path d="M200 59 q6 4 12 -1"/>`}
		${carry ? `<g transform="rotate(-8 222 54)"><rect x="210" y="40" width="34" height="42" rx="3" fill="#fff"/><path d="M217 52 h20 M217 60 h20 M217 68 h12" stroke-width="2.4"/></g>` : ""}`, `rotate(${head.toFixed(2)} 160 58)`);
	const tailG = `<path d="M50 70 q-12 -4 -10 -16" transform="rotate(${tail.toFixed(1)} 50 70)"/>`;
	const zzz = sleep > .5 ? [0, 1, 2].map((i) => { const p = (t * .45 + i / 3) % 1; return `<text x="${205 + p * 40}" y="${20 - p * 60}" font-size="${15 + p * 13}" class="sans" opacity="${(sin(p * PI)).toFixed(2)}">z</text>`; }).join("") : "";
	return G(G(legs + tailG + body + headG, `translate(0 ${bob.toFixed(2)})`) + zzz, `translate(${x} ${y}) scale(${flip ? -s : s} ${s}) translate(-112 -136)`);
}

function limb(sx, sy, a1, a2, l1, l2) {
	const ex = sx + l1 * sin(rad(a1)), ey = sy + l1 * cos(rad(a1));
	const hx = ex + l2 * sin(rad(a2)), hy = ey + l2 * cos(rad(a2));
	return { d: `M${sx.toFixed(1)} ${sy.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy.toFixed(1)}`, hx, hy };
}
function person(o) {
	const { x, y, s = 1, flip = false, la = [14, 6], ra = [-14, -6], ll = [7, 0], rl = [-7, 0], mood = "smile", hair = 0, shirt = "var(--lilac)", sit = false, sweat = 0, t = 0, tilt = 0, hold = "", lie = false } = o;
	const hipY = sit ? -36 : -72;
	const legA = sit ? [[84, 4], [78, -2]] : [ll, rl];
	const sh = hipY - 60;
	const L1 = limb(7, hipY, legA[0][0], legA[0][1], 36, 36), L2 = limb(-7, hipY, legA[1][0], legA[1][1], 36, 36);
	const A1 = limb(13, sh + 6, la[0], la[1], 30, 30), A2 = limb(-13, sh + 6, ra[0], ra[1], 30, 30);
	const foot = (l) => `<path d="M${l.hx.toFixed(1)} ${l.hy.toFixed(1)} h11"/>`;
	const hy = sh - 26;
	const hairs = [
		`<path d="M-20 ${hy} Q-25 ${hy - 27} 0 ${hy - 24} Q23 ${hy - 26} 20 ${hy - 3} Q10 ${hy - 15} -4 ${hy - 11} Q-14 ${hy - 11} -20 ${hy}Z" fill="var(--ink)"/>`,
		`<circle cx="-8" cy="${hy - 27}" r="9" fill="var(--ink)"/><path d="M-21 ${hy + 4} Q-25 ${hy - 25} 0 ${hy - 23} Q22 ${hy - 24} 20 ${hy - 4} Q8 ${hy - 14} -8 ${hy - 10} Q-16 ${hy - 6} -21 ${hy + 4}Z" fill="var(--ink)"/>`,
		`<path d="M-19 ${hy + 22} Q-30 ${hy - 28} 0 ${hy - 24} Q24 ${hy - 26} 20 ${hy - 2} Q8 ${hy - 14} -6 ${hy - 10} Q-10 ${hy + 8} -19 ${hy + 22}Z" fill="var(--ink)"/>`,
	][hair];
	const mouths = { smile: `<path d="M4 ${hy + 9} q6 6 12 0"/>`, frown: `<path d="M4 ${hy + 12} q6 -6 12 0"/>`, o: `<circle cx="10" cy="${hy + 10}" r="3.4"/>`, flat: `<path d="M5 ${hy + 10} h10"/>`, sleep: `<path d="M5 ${hy + 10} q5 3 9 0"/>` };
	const eyes = mood === "sleep" ? `<path d="M2 ${hy - 1} q3 3 6 0 M11 ${hy - 1} q3 3 6 0" stroke-width="2.6"/>` : `<circle cx="5" cy="${hy - 2}" r="2" fill="var(--ink)" stroke="none"/><circle cx="14" cy="${hy - 2}" r="2" fill="var(--ink)" stroke="none"/>`;
	const drops = sweat ? [0, 1, 2].map((i) => { const p = (t * 1.3 + i / 3) % 1; return `<path d="M${-30 - i * 9 - p * 10} ${hy - 22 + i * 12 + p * 22} q-4 7 0 9 q4 -2 0 -9" fill="#9fd3ff" stroke-width="2" opacity="${(sweat * sin(p * PI)).toFixed(2)}"/>`; }).join("") : "";
	const prop = hold === "phone" ? `<rect x="${A1.hx - 7}" y="${A1.hy - 22}" width="15" height="26" rx="3" fill="#0a0e2a"/>` : hold === "cup" ? `<path d="M${A1.hx - 7} ${A1.hy - 14} h15 l-2 16 h-11 Z" fill="#fff"/><path d="M${A1.hx + 8} ${A1.hy - 10} q7 2 0 9" />` : "";
	const inner = `<path d="${A2.d}"/>${lie ? "" : `<path d="${L2.d}"/>${foot(L2)}`}
		<path d="M-17 ${sh + 2} Q0 ${sh - 8} 17 ${sh + 2} L20 ${hipY - 2} Q0 ${hipY + 7} -20 ${hipY - 2} Z" fill="${shirt}"/>
		${lie ? "" : `<path d="${L1.d}"/>${foot(L1)}`}
		<g transform="rotate(${tilt} 0 ${hy + 18})"><circle cx="0" cy="${hy}" r="20" fill="var(--paper)"/>${hairs}${eyes}${mouths[mood]}</g>
		<path d="${A1.d}"/>${prop}${drops}`;
	return G(inner, `translate(${x} ${y}) scale(${flip ? -s : s} ${s})`);
}

function bot(o) {
	const { x, y, s = 1, t = 0, flip = false, color = ORANGE, arms = [0, 0], walk = 0, label = "", mood = "smile" } = o;
	const bob = sin(t * 5 + x * .01) * 2.5 + walk * Math.abs(sin(t * 12)) * -5;
	const blink = ((t * .6 + x * .013) % 1) < .05 ? .15 : 1;
	const st = walk * sin(t * 12) * 7;
	const inner = `<path d="M-8 -18 L${(-8 + st).toFixed(1)} -2 h-7 M8 -18 L${(8 - st).toFixed(1)} -2 h7"/>
		<rect x="-18" y="-50" width="36" height="33" rx="10" fill="${color}"/>
		<path d="M-18 -42 L${-32} ${(-30 - arms[0]).toFixed(1)}"/><path d="M18 -42 L32 ${(-30 - arms[1]).toFixed(1)}"/>
		<path d="M0 -90 V-104"/><circle cx="0" cy="-108" r="5.5" fill="${ORANGE}"/>
		<rect x="-26" y="-90" width="52" height="38" rx="13" fill="var(--paper)"/>
		<g transform="translate(0 -72) scale(1 ${blink}) translate(0 72)"><circle cx="-10" cy="-74" r="3.6" fill="var(--ink)" stroke="none"/><circle cx="10" cy="-74" r="3.6" fill="var(--ink)" stroke="none"/></g>
		${mood === "smile" ? `<path d="M-6 -63 q6 5 12 0" stroke-width="2.8"/>` : `<path d="M-5 -62 h10" stroke-width="2.8"/>`}
		${label ? `<text x="0" y="-28" font-size="13" text-anchor="middle" class="mono" style="fill:#2b1600">${esc(label)}</text>` : ""}`;
	return G(inner, `translate(${x} ${(y + bob).toFixed(2)}) scale(${flip ? -s : s} ${s})`);
}

const TC = { g: "#3fb950", r: "#ff7b72", y: "#e3b341", b: "#79c0ff", c: "#56d4dd", d: "#8b949e", o: "#FFA133" };
const mark = (s) => esc(s).replace(/\{([grybcdoB])\}/g, (_, k) => (k === "B" ? "<b>" : `<span style="color:${TC[k]}">`)).replace(/\{\/\}/g, "</span>").replace(/<\/span>(?=[^<]*<\/b>)/g, "</b>");
function term(o) {
	const { x, y, w, h, title = "", cmd = "", typed = 1, lines = [], n = lines.length, fs = 13, rot = 0, s = 1, op = 1, extra = "" } = o;
	if (op <= 0 || s <= 0) return "";
	const c = cmd.slice(0, Math.round(cmd.length * clamp(typed)));
	const rows = lines.slice(0, Math.max(0, Math.floor(n))).map((l) => (l.startsWith("{H}") ? `<div class="l hi">${mark(l.slice(3))}</div>` : `<div class="l">${l === "" ? "&nbsp;" : mark(l)}</div>`)).join("");
	const cur = typed < 1 || n < lines.length ? `<span class="cur"></span>` : "";
	return `<div class="term" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${op};transform:rotate(${rot.toFixed(2)}deg) scale(${s.toFixed(3)})"><div class="bar"><i></i><i></i><i></i><span>${esc(title)}</span></div><div class="body" style="font-size:${fs}px">${cmd ? `<div class="l"><span style="color:${TC.g}">$</span> <b>${esc(c)}</b>${typed < 1 ? cur : ""}</div>` : ""}${rows}${typed >= 1 && n < lines.length ? `<div class="l">${cur}</div>` : ""}${extra}</div></div>`;
}
const reveal = (t, times) => times.filter((x) => t >= x).length;
const cap = (t, a, b, html) => { const p = seg(t, a, a + .5) * (1 - seg(t, b - .4, b)); return p <= 0 ? "" : `<div class="cap" style="opacity:${p.toFixed(3)};transform:translateY(${((1 - out(seg(t, a, a + .5))) * 14).toFixed(1)}px)">${html}</div>`; };
const chip = (x, y, html, p, extra = "") => (p <= 0 ? "" : `<div class="chip" style="left:${x}px;top:${y}px;transform:scale(${back(clamp(p)).toFixed(3)});${extra}">${html}</div>`);
const card = (x, y, html, p = 1, extra = "") => (p <= 0 ? "" : `<div class="card" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;transform:scale(${back(clamp(p)).toFixed(3)});${extra}">${html}</div>`);
const ground = (p = 1, y = 560) => P(`M40 ${y} C300 ${y - 6} 520 ${y + 5} 760 ${y - 2} S1100 ${y + 4} 1240 ${y - 1}`, p, 'stroke-width="3" opacity=".55"');
const repoBox = (x, y, name, p, extra = "") => (p <= 0 ? "" : G(P("M0 14 q0 -8 8 -8 h34 l10 -12 h40 q8 0 8 8 v70 q0 8 -8 8 h-84 q-8 0 -8 -8 Z", p, 'fill="var(--paper)"') + (p > .6 ? T(50, 52, name, 30, 'text-anchor="middle"') : "") + extra, `translate(${x - 50} ${y - 40})`));
const dbCyl = (x, y, p, fill = 0) => (p <= 0 ? "" : G(
	(fill > 0 ? `<path d="M-40 ${40 - fill * 62} v${fill * 62} q40 18 80 0 v${-fill * 62} q-40 18 -80 0Z" fill="${ORANGE}" stroke="none" opacity=".85"/>` : "") +
	P("M-40 -24 q40 -20 80 0 q-40 20 -80 0 v64 q40 20 80 0 v-64", p, "") + (p > .6 ? T(0, 78, "db", 30, 'text-anchor="middle"') : ""), `translate(${x} ${y})`));

function s0(t) {
	const errs = [
		{ x: 70, y: 70, title: "api", line: "{r}error{/} connect ECONNREFUSED 127.0.0.1:5432", a: .5 },
		{ x: 880, y: 60, title: "web", line: "{r}TypeError:{/} API_URL is undefined", a: 1.2 },
		{ x: 905, y: 300, title: "mobile", line: "{y}WARN{/} POST /v2/login → 404", a: 1.9 },
	];
	const terms = errs.map((e, i) => term({ x: e.x, y: e.y, w: 330, h: 104, title: e.title, lines: [e.line, "{d}retrying…{/}"], n: t > e.a + .5 ? 2 : 1, fs: 12, s: pop(t, e.a), rot: sin(t * 7 + i * 2) * 1.6 })).join("");
	const tangle = P("M400 130 C520 60 560 250 640 210 S760 60 880 110 C980 150 820 250 905 350 C820 420 700 250 640 300 S470 330 400 180 C460 250 600 340 640 330", seg(t, 2.2, 5.5), `stroke="${RED}" stroke-width="2.6" opacity=".75"`);
	const marks = ["?"].map((m, i) => { const p = pop(t, 2.8 + i * .6); return p > 0 ? G(T(0, 0, m, 64, `text-anchor="middle" fill="${RED}" style="fill:${RED}"`), at(640, 318 + sin(t * 3) * 3, p, 0)) : ""; }).join("");
	const desk = P("M500 470 H800 M520 470 V560 M780 470 V560", seg(t, 0, .8)) + P("M690 468 h74 M700 468 l-10 -52 h72 l8 52", seg(t, .2, 1), 'fill="var(--paper)"') + P("M585 524 h40 M605 524 V560", seg(t, .1, .7));

		card(1010, 300, `🔔 fixed ABC-7 <small>github.com/acme/api/pull/415</small>`, pop(t, 9.6)) + rules +
		cap(t, .5, 6.4, "Now nobody presses start.<small>A ticket assigned to you is claimed and moved to In Progress.</small>") +
		cap(t, 6.6, 13.33, "It reviews its own diff, opens a draft PR,<small>moves the ticket to In Review, and rings you once.</small>");
}

const RUNGS = [["1", "You drive"], ["2", "It tells you"], ["3", "It drafts,", "you review"], ["4", "It works", "a shift"], ["5", "Lights out"]];
function sLadder(t) {
	const sx = (i) => 230 + i * 172, sy = (i) => 470 - i * 68;
	const stairs = P(`M230 560 V470 H402 V402 H574 V334 H746 V266 H918 V198 H1090 V560`, seg(t, .3, 2.2), `fill="var(--lilac)"`);
	const labels = RUNGS.map((r, i) => (t > .9 + i * .3 ? T(sx(i) + 14, sy(i) + 44, r[0], 46, 'style="fill:#C96A12"') + T(sx(i) + 46, sy(i) + 34, r[1], 23) + (r[2] ? T(sx(i) + 46, sy(i) + 56, r[2], 23) : "") : "")).join("");
	const climb = ease(seg(t, 4.8, 6));
	const bx = lerp(sx(2) + 100, sx(3) + 100, climb), by = lerp(sy(2), sy(3), climb) - sin(climb * PI) * 50;
	const tags = card(sx(0) + 50, sy(0) - 206, "payments", pop(t, 1.6)) + card(bx - 26, by - 168, `api <span class="tag">${climb > .9 ? "level 4" : "level 3"}</span>`, pop(t, 2)) + card(sx(4) + 14, sy(4) - 150, "docs", pop(t, 2.4));
	const first = "corgi agent level 3", second = 'corgi agent level 4 --done-when "go test ./..."';
	const cmd = t < 3.4 ? first.slice(0, Math.round(first.length * seg(t, .3, 1.2))) : second.slice(0, Math.round(second.length * seg(t, 3.4, 4.6)));
	return chip(40, 30, `<span class="g">$</span> ${esc(cmd)}`, pop(t, .1)) +
		(t > 6.1 ? chip(40, 84, `<span class="g">✓</span> done means the tests say so`, pop(t, 6.1), "font-size:13px;") : "") +
		svg(stairs + labels + person({ x: sx(0) + 96, y: sy(0), t, s: .8, mood: "smile", la: [14, 6] }) +
			(t > 2 ? bot({ x: bx, y: by, t, s: .9, color: "#F6D9B4", arms: climb > .9 ? [26, 26] : [0, 0] }) : "") +
			(t > 2.4 ? corgi({ x: sx(4) + 96, y: sy(4), t, s: .7, sleep: 1 }) : "") + P("M40 560 H230 M1090 560 H1240", 1, 'stroke-width="3" opacity=".55"')) + tags +
		cap(t, .5, 8, "You choose the step, per workspace.<small>Payments stays low, docs runs high. Climb when you trust it.</small>");
}

function sTeam(t) {
	const lap = (x, name) => P(`M${x - 52} 330 h104 M${x - 40} 330 l-8 -64 h96 l-8 64`, seg(t, .2, 1), 'fill="var(--paper)"') + (t > .6 ? T(x, 366, name, 26, 'text-anchor="middle"') : "");
	const hop = ease(seg(t, 3.8, 4.8));
	const cx = lerp(170, 430, hop), cy = 236 - sin(hop * PI) * 70;
	const crown = t > 1.2 ? G(`<path d="M-22 12 L-26 -12 L-10 0 L0 -18 L10 0 L26 -12 L22 12 Z" fill="${ORANGE}"/>`, at(cx, cy, pop(t, 1.2), sin(hop * PI) * 20)) + T(cx, cy - 26, "leads", 26, 'text-anchor="middle" style="fill:#C96A12"') : "";
	const pulse = P("M228 300 H372", seg(t, 1.4, 2), 'stroke-dasharray=".08 .08" opacity=".6"') + (t > 2 ? `<circle cx="${228 + ((t * .9) % 1) * 144}" cy="300" r="6" fill="${ORANGE}" stroke="none"/>` : "");
	const spent = t > 3 ? T(170, 398, "window spent", 24, `text-anchor="middle" style="fill:${RED}"`) : "";
	const quiet = t > 1.8 ? T(lerp(430, 170, hop), 424, t > 3 && hop >= 1 ? "rests" : "stays quiet", 24, 'text-anchor="middle" opacity=".6"') : "";
	const pass = ease(seg(t, 6.2, 7.2));
	const claude = bot({ x: 800, y: 560, t, color: "#F6D9B4", mood: t > 5.4 ? "flat" : "smile", arms: t < 5.4 ? [20 + sin(t * 22) * 7, 20 + cos(t * 22) * 7] : [0, 0] }) + T(800, 590, "claude", 26, 'text-anchor="middle"');
	const codex = bot({ x: 1050, y: 560, t, flip: true, color: "#D5E3F2", arms: t > 7.2 ? [20 + sin(t * 22) * 7, 20 + cos(t * 22) * 7] : [0, 0] }) + T(1050, 590, "codex", 26, 'text-anchor="middle"');
	const limit = t > 5.4 && t < 9.5 ? T(800, 420, "at its limit", 26, `text-anchor="middle" style="fill:${RED}"`) : "";
	return chip(40, 30, `<span class="g">$</span> corgi agent peers`, pop(t, .2)) + chip(640, 30, `<span class="g">$</span> corgi agent workspaces agents acme-stack claude,codex`, pop(t, 4.6), "font-size:12.5px;") +
		svg(ground() + lap(170, "home-mbp") + lap(430, "work-mbp") + pulse + crown + spent + quiet + claude + codex + limit + P("M620 110 V540", seg(t, 4.4, 5), 'opacity=".25" stroke-dasharray=".02 .02"')) +
		card(lerp(740, 990, pass), 350 - sin(pass * PI) * 90, `acme/api#418 <small>review comment</small>`, pop(t, 5)) +
		card(810, 150, `handoff <span class="tag g">typed packet</span><small>done · not done · decided · the check to re-run</small>`, pop(t, 8.2)) +
		cap(t, .5, 5, "Two laptops: one leads, the other takes over.") + cap(t, 5.2, 10.67, "Claude first, Codex when it cannot.<small>Work hands itself off, and the next run re-checks it.</small>");
}

const LEVELS = [
	["You drive", "You start every session.", "corgi makes the whole stack one command."],
	["It tells you", "It watches your sessions, trackers and PRs.", "You still press every button."],
	["It drafts, you review", "Agents take tickets to draft PRs.", "You read every diff."],
	["It works a shift", "Nobody presses start.", "You write specs and checks, and read PRs."],
	["Lights out", "Low-risk work that passes merges itself.", "The rest waits for you."],
];
const stepX = (i) => 230 + i * 172, stepY = (i) => 470 - i * 68;
const STAIRS = "M230 560 V470 H402 V402 H574 V334 H746 V266 H918 V198 H1090 V560";
const act = (n) => (t) => {
	const hop = ease(seg(t, .5, 1.5));
	const from = n === 1 ? [130, 560] : [stepX(n - 2) + 86, stepY(n - 2)], to = [stepX(n - 1) + 86, stepY(n - 1)];
	const hx = lerp(from[0], to[0], hop), hy = lerp(from[1], to[1], hop) - sin(hop * PI) * 70;
	const follow = ease(seg(t, 1, 2));
	const dx = lerp(from[0] - 70, to[0] - 62, follow), dy = lerp(from[1], to[1], follow) - sin(follow * PI) * 60;
	const done = [...Array(n)].map((_, i) => `<path d="M${stepX(i)} 560 V${stepY(i)} H${stepX(i) + 172} V560 Z" fill="${i === n - 1 ? ORANGE : "#F6D9B4"}" stroke="none" opacity="${i === n - 1 ? (.35 + .65 * seg(t, 1.3, 1.8)).toFixed(2) : 1}"/>`).join("");
	const nums = [0, 1, 2, 3, 4].map((i) => T(stepX(i) + 86, stepY(i) + 52, String(i + 1), 50, `text-anchor="middle" opacity="${i < n ? 1 : .35}"`)).join("");
	const sun = n === 5 ? `<circle cx="1004" cy="${lerp(330, 110, out(seg(t, .6, 3)))}" r="54" fill="${ORANGE}"/>` : "";
	const L = LEVELS[n - 1];
	return svg(sun + `<path d="${STAIRS}" fill="var(--lilac)"/>` + done + P(STAIRS, 1, "") + P("M40 560 H230 M1090 560 H1240", 1, 'stroke-width="3" opacity=".55"') + nums +
		G(`<text font-size="17" class="sans" style="fill:#C96A12;letter-spacing:.18em;font-weight:600">LEVEL ${n} OF 5</text>`, at(64, 96, pop(t, .2))) + G(T(0, 0, L[0], 100, 'style="font-weight:500;letter-spacing:-.025em"'), at(60, 172, pop(t, .5))) +
		person({ x: hx, y: hy, t, s: .8, mood: "smile", la: hop > 0 && hop < 1 ? [150, 170] : [14, 6], ra: hop > 0 && hop < 1 ? [-150, -170] : [-14, -6] }) +
		corgi({ x: dx, y: dy, t, s: .55, walk: follow > 0 && follow < 1 ? 1 : 0 })) +
		cap(t, 1.3, 5.33, `${L[1]}<small>${L[2]}</small>`);
};
const act1 = act(1), act2 = act(2), act3 = act(3), act4 = act(4), act5 = act(5);
function hud(level) {
	if (!level) return "";
	const steps = [0, 1, 2, 3, 4].map((i) => `<rect x="${24 + i * 26}" y="${694 - (i + 1) * 11}" width="26" height="${(i + 1) * 11}" fill="${i < level ? ORANGE : "var(--paper)"}" stroke-width="2.4"/>`).join("");
	return svg(steps + `<circle cx="${37 + (level - 1) * 26}" cy="${694 - level * 11 - 9}" r="6" fill="var(--ink)" stroke="none"/>` + `<text x="164" y="676" font-size="11.5" class="sans" style="fill:#C96A12;letter-spacing:.16em;font-weight:600">LEVEL ${level}</text>` + T(164, 696, LEVELS[level - 1][0], 24));
}
const SCENES = [s0, s1, act1, s2, s3, sTools, act2, s7, s6, act3, s5, s4, act4, sAuto, s8, sTeam, act5, s9, sLadder, s10];
const LEVEL_OF = new Map([[s2, 1], [s3, 1], [sTools, 1], [s7, 2], [s6, 2], [s5, 3], [s4, 3], [sAuto, 4], [s8, 4], [sTeam, 4], [s9, 5]]);
const stage = document.getElementById("stage");
function render(time) {
	const t = clamp(time, 0, DURATION - .001);
	let i = SCENE_BARS.findIndex((b, k) => t < SCENE_BARS[k + 1] * BAR);
	if (i < 0) i = SCENES.length - 1;
	const a = SCENE_BARS[i] * BAR, D = (SCENE_BARS[i + 1] - SCENE_BARS[i]) * BAR, lt = t - a;
	const fade = Math.min(seg(lt, 0, .35), i === SCENES.length - 1 ? 1 : 1 - seg(lt, D - .3, D));
	let night = 0;
	if (SCENES[i] === s8) night = ease(seg(lt, 0, 1.2)) * (1 - ease(seg(lt, 8.2, 9.6)));
	stage.style.setProperty("--ink", mix(INK, PAPER, night));
	stage.style.setProperty("--paper", mix(PAPER, NIGHT, night));
	stage.style.setProperty("--lilac", mix("#E4E6F5", "#2a2f66", night));
	stage.style.background = mix(PAPER, NIGHT, night);
	const boil = Math.floor(t * 4) % 3;
	stage.innerHTML = `<div style="position:absolute;inset:0;opacity:${fade.toFixed(3)}"><style>svg.ink{filter:url(#boil${boil})}</style>${SCENES[i](lt, D)}${hud(LEVEL_OF.get(SCENES[i]))}</div>`;
}

const music = document.getElementById("music"), ui = document.getElementById("ui"), bar = document.getElementById("bar"), fit = document.getElementById("fit");
const capture = new URLSearchParams(location.search).has("capture");
if (capture) document.body.classList.add("capture");
function layout() {
	const s = capture ? 1 : Math.min(innerWidth / 1280, innerHeight / 720);
	fit.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener("resize", layout); layout();
window.seek = (t) => { render(t); return true; };
window.filmDuration = DURATION;

let playing = false, clock0 = 0, hasAudio = false;
const now = () => (hasAudio && !music.paused ? music.currentTime : (performance.now() - clock0) / 1000);
function tick() {
	if (!playing) return;
	const t = now();
	render(t);
	bar.firstElementChild.style.width = `${(t / DURATION) * 100}%`;
	if (t >= DURATION || (hasAudio && music.ended)) { playing = false; ui.style.display = "flex"; ui.querySelector("button").textContent = "↻  Play again"; return; }
	requestAnimationFrame(tick);
}
function play(from = 0) {
	ui.style.display = "none"; playing = true; clock0 = performance.now() - from * 1000;
	try { music.currentTime = from; } catch {}
	const started = music.play();
	if (started) started.then(() => { hasAudio = true; }).catch(() => { hasAudio = false; });
	requestAnimationFrame(tick);
}
ui.addEventListener("click", () => play(0));
bar.addEventListener("click", (e) => { const r = bar.getBoundingClientRect(); const t = ((e.clientX - r.left) / r.width) * DURATION; if (playing) { clock0 = performance.now() - t * 1000; try { music.currentTime = t; } catch {} } else play(t); });
Promise.all([document.fonts.load('500 40px Fraunces'), document.fonts.load('600 40px Fraunces'), document.fonts.load('italic 500 40px Fraunces'), document.fonts.load('400 20px Inter'), document.fonts.load('500 20px Inter'), document.fonts.load('600 20px Inter')]).catch(() => {}).then(() => document.fonts.ready).then(() => { render(capture ? 0 : 9); window.filmReady = true; });
</script>
