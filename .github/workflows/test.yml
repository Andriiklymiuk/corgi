name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main run this via release.yml, which invokes it as a gate —
  # no separate push trigger, or every push would run CI (and Sonar) twice.
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
          echo "gofmt: all files clean"

  test:
    name: Test + Coverage + Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true

      - name: Run tests with coverage
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic -timeout 5m

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage floor gate
        run: ./scripts/coverage-floor.sh coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      # A SonarCloud outage (503 on their side) must not hold a release: the
      # tests above are the gate, the scan is a report.
      - name: SonarCloud Scan
        if: github.repository == 'Andriiklymiuk/corgi'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
