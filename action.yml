name: Setup corgi
description: Install corgi from a verified release archive and expose what a CI cache should persist.
author: Andrii Klymiuk

branding:
  icon: box
  color: orange

inputs:
  version:
    description: >-
      corgi version to install, without the leading v (e.g. 1.20.13). Omit to
      take the latest release. Pinning keeps a workflow reproducible.
    required: false
    default: ""
  working-directory:
    description: Directory holding corgi-compose.yml. Cache outputs are derived from it.
    required: false
    default: "."

outputs:
  version:
    description: The corgi version that was installed.
    value: ${{ steps.setup.outputs.version }}
  cache-paths:
    description: >-
      Newline-separated directories worth caching, derived from every service's
      beforeStart cacheKey. Pass straight to actions/cache's path input.
    value: ${{ steps.setup.outputs.cache-paths }}
  cache-key:
    description: >-
      Cache key that changes whenever any cacheKey file changes. Pass straight
      to actions/cache's key input.
    value: ${{ steps.setup.outputs.cache-key }}
  cache-groups:
    description: >-
      The same plan split per ecosystem, as JSON: a list of
      {id, key, paths, pathsText}. One actions/cache step per entry keeps a
      change to one language's lockfile from evicting every other language's
      packages. pathsText is newline-joined because an Actions expression
      cannot build that string itself.
    value: ${{ steps.setup.outputs.cache-groups }}
  cache-1-key:
    description: >-
      Group 1's key, empty when there is no such group. A composite action
      cannot loop actions/cache, so the groups are also published as four fixed
      slots: a workflow writes four identical cache steps reading
      cache-N-key/cache-N-paths, with no fromJSON indexing and no
      "did I add enough slots" step of its own.
    value: ${{ steps.setup.outputs.cache-1-key }}
  cache-1-paths:
    description: Group 1's newline-separated paths, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-1-paths }}
  cache-2-key:
    description: Group 2's key, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-2-key }}
  cache-2-paths:
    description: Group 2's newline-separated paths, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-2-paths }}
  cache-3-key:
    description: Group 3's key, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-3-key }}
  cache-3-paths:
    description: Group 3's newline-separated paths, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-3-paths }}
  cache-4-key:
    description: Group 4's key, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-4-key }}
  cache-4-paths:
    description: Group 4's newline-separated paths, empty when there is no such group.
    value: ${{ steps.setup.outputs.cache-4-paths }}
  cache-overflow:
    description: >-
      How many ecosystems did not fit the four slots. The action already warns
      when this is non-zero, so a workflow does not need a step to check.
    value: ${{ steps.setup.outputs.cache-overflow }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # --proto '=https' refuses any non-https URL, including one arrived at
        # through a redirect, so a hijacked redirect cannot downgrade the
        # transport. --tlsv1.2 rules out obsolete TLS.
        curl_opts=(--fail --silent --show-error --location --proto '=https' --tlsv1.2)

        version="${REQUESTED_VERSION#v}"
        if [ -z "$version" ]; then
          version="$(curl "${curl_opts[@]}" \
            https://api.github.com/repos/Andriiklymiuk/corgi/releases/latest \
            | jq -r .tag_name)"
          version="${version#v}"
        fi

        case "$(uname -s)" in
          Linux) os=linux ;;
          Darwin) os=darwin ;;
          *) echo "::error::corgi action supports Linux and macOS runners, not $(uname -s)"; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac

        archive="corgi_${version}_${os}_${arch}.tar.gz"
        base="https://github.com/Andriiklymiuk/corgi/releases/download/v${version}"
        tmp="$(mktemp -d)"

        curl "${curl_opts[@]}" -o "$tmp/$archive" "$base/$archive"
        curl "${curl_opts[@]}" -o "$tmp/checksums.txt" "$base/checksums.txt"

        # Verify before anything is executed: the release publishes checksums,
        # so a tampered or truncated download fails here rather than running.
        (
          cd "$tmp"
          if command -v sha256sum >/dev/null 2>&1; then
            grep " ${archive}\$" checksums.txt | sha256sum --check --status -
          else
            grep " ${archive}\$" checksums.txt | shasum --algorithm 256 --check --status -
          fi
        ) || { echo "::error::checksum mismatch for $archive — refusing to install"; exit 1; }

        tar -xzf "$tmp/$archive" -C "$tmp" corgi
        sudo install -m 0755 "$tmp/corgi" /usr/local/bin/corgi
        rm -rf "$tmp"

        installed="$(corgi version --json | jq -r .version)"
        echo "version=$installed" >> "$GITHUB_OUTPUT"
        echo "corgi $installed (verified against checksums.txt)"

        # Only available once a compose file exists; installing corgi before
        # the checkout should still succeed here.
        if ls ./*corgi-compose.yml >/dev/null 2>&1 || [ -f corgi-compose.yml ]; then
          {
            echo "cache-paths<<CORGI_ACTION_EOF"
            corgi cache paths
            echo "CORGI_ACTION_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "cache-key=$(corgi cache paths --key)" >> "$GITHUB_OUTPUT"
          groups="$(corgi cache paths --json | jq -c '.groups // []')"
          echo "cache-groups=$groups" >> "$GITHUB_OUTPUT"

          # Four fixed slots as well as the JSON. An Actions expression cannot
          # loop, and neither can a composite action, so every workflow used to
          # copy the same cache step four times with fromJSON(...)[i] indexing
          # plus a hand-written "ran out of slots" warning. The slots keep the
          # copies but make each one plain, and the warning moves in here.
          total="$(jq 'length' <<<"$groups")"
          for i in 1 2 3 4; do
            key="$(jq -r --argjson i "$i" '.[$i-1].key // ""' <<<"$groups")"
            echo "cache-$i-key=$key" >> "$GITHUB_OUTPUT"
            {
              echo "cache-$i-paths<<CORGI_ACTION_EOF"
              jq -r --argjson i "$i" '.[$i-1].pathsText // ""' <<<"$groups"
              echo "CORGI_ACTION_EOF"
            } >> "$GITHUB_OUTPUT"
          done

          overflow=$(( total > 4 ? total - 4 : 0 ))
          echo "cache-overflow=$overflow" >> "$GITHUB_OUTPUT"
          if [ "$overflow" -gt 0 ]; then
            echo "::warning::corgi found $total cache groups but the action publishes four slots; $overflow ecosystem(s) will not be cached. Use the cache-groups JSON if you need all of them."
          fi
        else
          echo "::notice::no corgi-compose.yml in ${{ inputs.working-directory }} yet, so no cache outputs"
          for i in 1 2 3 4; do
            echo "cache-$i-key=" >> "$GITHUB_OUTPUT"
            echo "cache-$i-paths=" >> "$GITHUB_OUTPUT"
          done
          echo "cache-overflow=0" >> "$GITHUB_OUTPUT"
        fi
