schema_version: "1.0"
name: proactive-puts-it-on-the-board
description: The unattended weekly idea is one task with evidence, headed for the board - never a file, a list or a question.
tags: [read-only]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Run /corgi-suggest-proactive in this workspace. Nobody is at the desk and this session has no shell: end with the exact commands that put the idea on the board and record it.
graders:
  - name: fires-proactive
    type: tool_used
    tool: Skill
    input_match: '"(corgi:)?(corgi-)?suggest-proactive"'
  - name: task-for-the-board
    type: regex
    pattern: 'corgi agent task add'
  - name: recorded-in-the-history
    type: regex
    pattern: 'corgi suggest-history record'
  - name: evidence-you-can-open
    type: regex
    pattern: '\.py:\d+|README\.md'
  - name: ends-without-a-question
    type: regex
    match: not_contains
    pattern: '\?\s*$'
  - name: headline-first
    type: llm
    criteria: |
      Score 1 if the very first line of the answer is a short headline naming the proposed idea. Score 0 if the first line is a mode or status line, an apology, or a description of what could not be done.
  - name: one-idea
    type: llm
    criteria: |
      Score 1 if the answer proposes exactly one idea to build. Score 0 if it also lists runner-up, lower-ranked or alternative ideas, or offers a choice.
