schema_version: "1.0"
name: proactive-puts-it-on-the-board
description: The unattended weekly idea lands on the board as one task with evidence, never as a file or a question.
tags: [shell]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 45
  timeout_seconds: 720
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  prompt: |
    Run /corgi-suggest-proactive in this workspace. Nobody is at the desk.
graders:
  - name: fires-proactive
    type: tool_used
    tool: Skill
    input_match: '"(corgi:)?(corgi-)?suggest-proactive"'
  - name: task-on-the-board
    type: regex
    target: trace
    pattern: 'corgi agent task add'
  - name: recorded-in-the-history
    type: regex
    target: trace
    pattern: 'corgi suggest-history record'
  - name: nothing-under-docs
    type: regex
    target: files
    match: not_contains
    pattern: '(^|\n)docs/'
  - name: one-idea-with-evidence
    type: llm
    criteria: |
      Score 1 if the answer opens with a one-line headline naming exactly one idea, cites evidence a reader can open (a file and line, a README promise, a missing test), says the task is on the board, and ends without a question. Score 0 if it offers several ideas to choose from, asks the user anything, changed code, or reports that nothing was put on the board.
