schema_version: "1.0"
name: stories-skips-a-one-liner
description: A one-line edit is just done - no story, no spec, no branch.
tags: [edit]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Edit, Write]
  prompt: |
    Change the README title from "# acme" to "# Acme API".
graders:
  - name: stays-out-of-stories
    type: tool_used
    tool: Skill
    input_match: '"(corgi:)?stories"'
    min: 0
    max: 0
    arm: both
  - name: title-changed
    type: regex
    target: { source: file, path: README.md }
    flags: m
    pattern: '^# Acme API$'
