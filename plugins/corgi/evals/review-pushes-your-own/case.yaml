schema_version: "1.0"
name: review-pushes-your-own
description: Feedback on your own merge request is applied everywhere it reaches, and what could not be done is named - never handed back as a question.
tags: [edit]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Edit, Write]
  prompt: |
    Fix the comments on my MR https://gitlab.com/acme/api/-/merge_requests/41 - the reviewer asked to rename fetch_user to fetch_user_by_id and to add a test for the 404 branch.

    GitLab is not reachable from this machine and this session has no shell. The MR's branch is checked out here; the open threads are saved in `.mr/41/threads.json`.
graders:
  - name: fires-review
    type: tool_used
    tool: Skill
    input_match: '"(corgi:)?(corgi-)?review"'
  - name: renamed-at-the-definition
    type: regex
    target: { source: file, path: api/app/users.py }
    pattern: 'def fetch_user_by_id\('
  - name: no-caller-left-behind
    type: regex
    target: { source: file, path: api/app/notify.py }
    match: not_contains
    pattern: 'fetch_user\('
  - name: mocks-renamed-too
    type: regex
    target: { source: file, path: api/tests/test_orders.py }
    match: not_contains
    pattern: '\.fetch_user"'
  - name: covers-the-404
    type: regex
    target: { source: file, path: api/tests/test_profile.py }
    pattern: '404'
  - name: names-what-is-left
    type: llm
    criteria: |
      Score 1 if the final message says what changed for each of the two threads and names what it could not do without a shell or GitLab: run the tests, commit and push, post the replies. Score 0 if it asks whether to apply the changes, claims the tests pass or the branch is pushed, or ends on a plan instead of having edited the files.
