name: corgi cache plan
description: >-
  What a CI cache should persist, computed from the cloned services. Place it
  after `corgi init`, then feed actions/cache from its outputs.
author: Andrii Klymiuk

branding:
  icon: box
  color: orange

inputs:
  working-directory:
    description: Directory holding corgi-compose.yml. Cache outputs are derived from it.
    required: false
    default: "."

outputs:
  cache-paths:
    description: >-
      Newline-separated directories worth caching, derived from every service's
      beforeStart cacheKey. Pass straight to actions/cache's path input.
    value: ${{ steps.plan.outputs.cache-paths }}
  cache-key:
    description: >-
      Cache key that changes whenever any cacheKey file changes. Pass straight
      to actions/cache's key input.
    value: ${{ steps.plan.outputs.cache-key }}
  cache-groups:
    description: >-
      The same plan split per ecosystem, as JSON: a list of
      {id, key, paths, pathsText, restorePrefix, missingFiles}. One
      actions/cache step per entry keeps a change to one language's lockfile
      from evicting every other language's packages.
    value: ${{ steps.plan.outputs.cache-groups }}
  cache-1-key:
    description: >-
      Group 1's key, empty when there is no such group. A composite action
      cannot loop actions/cache, so the groups are also published as four fixed
      slots: a workflow writes four identical cache steps reading
      cache-N-key/cache-N-paths/cache-N-restore-keys.
    value: ${{ steps.plan.outputs.cache-1-key }}
  cache-1-paths:
    description: Group 1's newline-separated paths, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-1-paths }}
  cache-1-restore-keys:
    description: >-
      Group 1's restore-keys prefix (corgi-deps-<ecosystem>-), so a lockfile
      change restores the previous packages instead of starting empty. Empty
      when there is no such group, and for the markers group, which is
      exact-key only.
    value: ${{ steps.plan.outputs.cache-1-restore-keys }}
  cache-2-key:
    description: Group 2's key, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-2-key }}
  cache-2-paths:
    description: Group 2's newline-separated paths, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-2-paths }}
  cache-2-restore-keys:
    description: Group 2's restore-keys prefix, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-2-restore-keys }}
  cache-3-key:
    description: Group 3's key, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-3-key }}
  cache-3-paths:
    description: Group 3's newline-separated paths, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-3-paths }}
  cache-3-restore-keys:
    description: Group 3's restore-keys prefix, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-3-restore-keys }}
  cache-4-key:
    description: Group 4's key, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-4-key }}
  cache-4-paths:
    description: Group 4's newline-separated paths, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-4-paths }}
  cache-4-restore-keys:
    description: Group 4's restore-keys prefix, empty when there is no such group.
    value: ${{ steps.plan.outputs.cache-4-restore-keys }}
  cache-overflow:
    description: >-
      How many ecosystems did not fit the four slots. The action already warns
      when this is non-zero, so a workflow does not need a step to check.
    value: ${{ steps.plan.outputs.cache-overflow }}
  cache-complete:
    description: Always "true" here; the step fails instead when a cacheKey file is missing.
    value: ${{ steps.plan.outputs.cache-complete }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # A cacheKey file that is not on disk hashes to a fixed marker, so the
        # key would be the same on every run and the cache would never
        # invalidate. Failing here is the whole reason this action exists
        # separately from the install one.
        CORGI_CACHE_STRICT: "true"
      run: |
        set -euo pipefail
        if ! command -v corgi >/dev/null 2>&1; then
          echo "::error::corgi is not installed; add \`uses: Andriiklymiuk/corgi@v1\` before this step"
          exit 1
        fi
        bash "$GITHUB_ACTION_PATH/emit-outputs.sh"
